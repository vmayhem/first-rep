<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanish Reader</title>
<style>
  :root {
    --bg: #fbf6ef;
    --card: #ffffff;
    --ink: #1d1d1d;
    --muted: #6a645b;
    --accent: #b3261e;
    --mark: #ffe08a;
    --seen: #c9a227;
    --line: #d9d2c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1816;
      --card: #26231f;
      --ink: #f1ece4;
      --muted: #a39c90;
      --accent: #ff8a80;
      --mark: #6b5310;
      --seen: #a8861f;
      --line: #3d3832;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 96px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 26px; margin: 0; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  textarea {
    width: 100%; min-height: 50vh; resize: vertical;
    font: inherit; padding: 14px 16px;
    border: 2px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink);
  }
  textarea:focus-visible, button:focus-visible, .w:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 10px 20px; border-radius: 999px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button:disabled { opacity: .45; cursor: default; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }

  #text {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 22px; line-height: 1.8;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .w { cursor: pointer; border-radius: 4px; padding: 1px 0; -webkit-tap-highlight-color: transparent; }
  .w:hover { background: color-mix(in srgb, var(--mark) 45%, transparent); }
  .w.seen { text-decoration: underline dotted var(--seen); text-underline-offset: 5px; }
  .w.active { background: var(--mark); }

  #pop {
    position: absolute; z-index: 10;
    width: max-content; max-width: min(320px, calc(100vw - 24px));
    background: var(--card); color: var(--ink);
    border: 2px solid var(--line); border-radius: 12px;
    padding: 10px 14px 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    font-size: 17px; line-height: 1.35;
  }
  #pop .src { font-size: 14px; color: var(--muted); }
  #pop .tr { font-size: 21px; font-weight: 700; margin: 2px 0; }
  #pop .alt { font-size: 15px; color: var(--muted); }
  #pop a { font-size: 14px; color: var(--accent); display: block; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Spanish Reader</h1>
    <button id="edit" class="hidden">Edit text</button>
  </header>

  <section id="paste">
    <p class="muted">Paste a song, a paragraph, anything in Spanish. Then tap any word you don't know.</p>
    <textarea id="input" placeholder="Pega tu texto aquí…" lang="es" spellcheck="false"></textarea>
    <div class="actions">
      <button id="read" class="primary" disabled>Read</button>
      <button id="clear">Clear</button>
    </div>
  </section>

  <section id="reader" class="hidden">
    <div id="text" lang="es"></div>
  </section>
</main>

<div id="pop" class="hidden" role="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const input = $('input'), textEl = $('text'), pop = $('pop');
  const WORD = /[\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*/gu;
  const TEXT_KEY = 'reader.text', CACHE_KEY = 'reader.cache';

  const store = {
    get(k, fallback) { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const cache = store.get(CACHE_KEY, {});
  let active = null;

  function show(reading) {
    $('paste').classList.toggle('hidden', reading);
    $('reader').classList.toggle('hidden', !reading);
    $('edit').classList.toggle('hidden', !reading);
    closePop();
  }

  function render(text) {
    textEl.textContent = '';
    let last = 0;
    for (const m of text.matchAll(WORD)) {
      if (m.index > last) textEl.append(text.slice(last, m.index));
      const span = document.createElement('span');
      span.className = 'w';
      span.tabIndex = 0;
      span.textContent = m[0];
      if (cache[m[0].toLowerCase()]) span.classList.add('seen');
      textEl.append(span);
      last = m.index + m[0].length;
    }
    if (last < text.length) textEl.append(text.slice(last));
  }

  async function translate(word) {
    if (cache[word]) return cache[word];
    const url = 'https://api.mymemory.translated.net/get?langpair=es|en&q=' + encodeURIComponent(word);
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.responseStatus !== 200) throw new Error(data.responseDetails || 'Translation failed');
    const main = data.responseData.translatedText.trim();
    const alts = [];
    for (const m of data.matches || []) {
      const t = (m.translation || '').trim();
      const isNew = t && ![main, ...alts].some((x) => x.toLowerCase() === t.toLowerCase());
      if (isNew && t.length < 40 && alts.length < 3) alts.push(t);
    }
    const entry = { main, alts };
    cache[word] = entry;
    store.set(CACHE_KEY, cache);
    return entry;
  }

  function fillPop(word, body) {
    pop.textContent = '';
    const src = document.createElement('div');
    src.className = 'src';
    src.textContent = word;
    pop.append(src, ...body);
    const more = document.createElement('a');
    more.href = 'https://www.wordreference.com/es/en/translation.asp?spen=' + encodeURIComponent(word);
    more.target = '_blank';
    more.rel = 'noopener';
    more.textContent = 'More on WordReference ↗';
    pop.append(more);
  }

  function line(cls, text) {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    return d;
  }

  function placePop(span) {
    pop.classList.remove('hidden');
    const r = span.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 8;
    let left = r.left + r.width / 2 - pw / 2;
    left = Math.max(12, Math.min(left, document.documentElement.clientWidth - pw - 12));
    const below = r.bottom + gap + ph < window.innerHeight || r.top - gap - ph < 0;
    const top = below ? r.bottom + gap : r.top - gap - ph;
    pop.style.left = left + window.scrollX + 'px';
    pop.style.top = top + window.scrollY + 'px';
  }

  function closePop() {
    pop.classList.add('hidden');
    active?.classList.remove('active');
    active = null;
  }

  async function lookup(span) {
    if (span === active) return closePop();
    closePop();
    active = span;
    span.classList.add('active');
    const shown = span.textContent;
    const word = shown.toLowerCase();
    fillPop(shown, [line('alt', 'Translating…')]);
    placePop(span);
    try {
      const { main, alts } = await translate(word);
      if (active !== span) return;
      const body = [line('tr', main)];
      if (alts.length) body.push(line('alt', 'also: ' + alts.join(', ')));
      fillPop(shown, body);
      for (const el of textEl.querySelectorAll('.w')) {
        if (el.textContent.toLowerCase() === word) el.classList.add('seen');
      }
    } catch {
      if (active !== span) return;
      fillPop(shown, [line('alt', 'Couldn’t get a translation right now.')]);
    }
    placePop(span);
  }

  function startReading() {
    const text = input.value.trim();
    if (!text) return;
    store.set(TEXT_KEY, text);
    render(text);
    show(true);
    window.scrollTo(0, 0);
  }

  input.addEventListener('input', () => { $('read').disabled = !input.value.trim(); });
  $('read').addEventListener('click', startReading);
  $('clear').addEventListener('click', () => {
    input.value = '';
    $('read').disabled = true;
    store.set(TEXT_KEY, '');
    input.focus();
  });
  $('edit').addEventListener('click', () => { show(false); input.focus(); });

  document.addEventListener('click', (e) => {
    const span = e.target.closest('.w');
    if (span) lookup(span);
    else if (!e.target.closest('#pop')) closePop();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePop();
    else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('w')) {
      e.preventDefault();
      lookup(e.target);
    }
  });
  window.addEventListener('resize', () => { if (active) placePop(active); });

  const saved = store.get(TEXT_KEY, '');
  if (saved) {
    input.value = saved;
    $('read').disabled = false;
    startReading();
  }
})();
</script>
</body>
</html>
